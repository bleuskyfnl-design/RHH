
name: RedFox RHH

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redfox-rhh
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install atproto google-api-python-client google-auth pillow

      - name: Run RedFox RHH
        env:
          BLUESKY_HANDLE: redheadheaven.bsky.social
          RHH_PASSWORD: ${{ secrets.RHH_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python redfoxRHH.py
