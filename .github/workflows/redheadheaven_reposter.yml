name: RedheadHeaven Reposter

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redheadheaven-reposter
  cancel-in-progress: false

jobs:
  repost:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip atproto

      - name: Run RedheadHeaven Reposter
        env:
          RHH_PASSWORD: ${{ secrets.RHH_PASSWORD }}
        run: python redheadheaven_reposter.py
