name: RedheadHeaven New Post

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redheadheaven-new-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install atproto google-api-python-client google-auth pillow

      - name: Check FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Run RedheadHeaven New Post
        env:
          RHH_PASSWORD: ${{ secrets.RHH_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python redheadheaven_new_post.py
