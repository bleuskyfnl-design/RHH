
name: Katrina RHH

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: katrina-rhh
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install atproto google-api-python-client google-auth pillow

      - name: Check FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Run Katrina
        env:
          RHH_PASSWORD: ${{ secrets.RHH_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python Katrina.py
